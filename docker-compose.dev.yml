services:
  radar-ia:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: radaria-app-teste:latest
    container_name: radar-ia-teste
    restart: 'no'
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - radaria_node_modules_teste:/app/node_modules
    env_file:
      - .env
    depends_on:
      radar-postgres:
        condition: service_healthy
    command: npm run dev

  radar-postgres:
    image: postgres:16-alpine
    container_name: radar-ia-postgres-teste
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radaria}
      POSTGRES_DB: ${POSTGRES_DB:-radaria_dev}
    ports:
      - "5433:5432"
    volumes:
      - radaria_postgres_data_teste:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radaria} -d ${POSTGRES_DB:-radaria_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  radaria_node_modules_teste:
  radaria_postgres_data_teste: