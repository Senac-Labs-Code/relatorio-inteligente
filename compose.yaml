services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: radar-frontend
    restart: "no"
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:${BACKEND_PORT:-4000}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: radar-backend
    restart: "no"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT:-4000}
      AGENTE_SERVICE_URL: http://agente-service:${AGENTE_SERVICE_PORT:-8000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-radaria}:${POSTGRES_PASSWORD:-radaria}@radar-postgres:5432/${POSTGRES_DB:-radaria_dev}?schema=public
    depends_on:
      radar-postgres:
        condition: service_healthy

  agente-service:
    build:
      context: ./agente-service
      dockerfile: Dockerfile
      target: development
    container_name: radar-agente-service
    restart: "no"
    ports:
      - "${AGENTE_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./agente-service:/app
      - agente_service_venv:/app/.venv
    env_file:
      - .env
    depends_on:
      radar-postgres:
        condition: service_healthy

  radar-postgres:
    image: postgres:16-alpine
    container_name: radar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radaria}
      POSTGRES_DB: ${POSTGRES_DB:-radaria_dev}
    ports:
      - "5432:5432"
    volumes:
      - radaria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-radaria} -d ${POSTGRES_DB:-radaria_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  backend_node_modules:
  agente_service_venv:
  radaria_postgres_data: